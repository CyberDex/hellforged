<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Slot</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
            }
            canvas {
                display: block;
            }
            #loader {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            #loader-arc {
                transition: stroke-dasharray 200ms linear;
            }
        </style>
    </head>

    <body>
        <svg
            id="loader"
            width="48"
            height="48"
            viewBox="0 0 48 48"
            style="position: absolute"
        >
            <circle
                cx="24"
                cy="24"
                r="20"
                fill="none"
                stroke="rgba(255,255,255,0.15)"
                stroke-width="4"
            />
            <circle
                id="loader-arc"
                cx="24"
                cy="24"
                r="20"
                fill="none"
                stroke="#fff"
                stroke-width="4"
                stroke-linecap="round"
                stroke-dasharray="0 126"
            >
                <animateTransform
                    attributeName="transform"
                    type="rotate"
                    from="0 24 24"
                    to="360 24 24"
                    dur="0.8s"
                    repeatCount="indefinite"
                />
            </circle>
        </svg>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
