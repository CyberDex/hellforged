<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- Cut from the logo in `assets` at build time, by `faviconPlugin` in
        vite.config.ts. Relative, to survive being served from a subpath. -->
        <link rel="icon" type="image/png" href="./favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hellforged</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
            }
            canvas {
                display: block;
                animation: canvas-fade-in 300ms ease-out both;
            }
            @keyframes canvas-fade-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                canvas {
                    animation: none;
                }
            }
            #loader {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                line-height: 0;
            }
            #loader-arc {
                transition: stroke-dasharray 200ms linear;
            }
        </style>
      <script type="module" crossorigin src="./js/index-umcpEg4L.js"></script>
      <link rel="modulepreload" crossorigin href="./js/pixi-BzzedQG4.js">
      <link rel="modulepreload" crossorigin href="./js/game.controller-DPlkP3c0.js">
      <link rel="stylesheet" crossorigin href="./js/index-B9SOWGxV.css">
    </head>

    <body>
        <svg
            id="loader"
            width="48"
            height="48"
            viewBox="0 0 48 48"
            style="position: absolute"
        >
            <circle
                cx="24"
                cy="24"
                r="20"
                fill="none"
                stroke="rgba(255,255,255,0.15)"
                stroke-width="4"
            />
            <circle
                id="loader-arc"
                cx="24"
                cy="24"
                r="20"
                fill="none"
                stroke="#fff"
                stroke-width="4"
                stroke-linecap="round"
                stroke-dasharray="0 126"
            >
                <animateTransform
                    attributeName="transform"
                    type="rotate"
                    from="0 24 24"
                    to="360 24 24"
                    dur="0.8s"
                    repeatCount="indefinite"
                />
            </circle>
        </svg>
    </body>
</html>
