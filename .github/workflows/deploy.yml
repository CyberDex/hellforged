name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# Pages is served from the `gh-pages` branch (not the Pages API), because one
# repo can only have a single API-driven deployment — and we need room for the
# per-PR previews that live under `pr-preview/` on that same branch.
permissions:
    contents: write

concurrency:
    group: gh-pages-main
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            # Skip Jekyll: the build output is already a static site.
            - run: touch dist/.nojekyll
            - uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: dist
                  branch: gh-pages
                  # Everything at the root is ours to replace; the preview
                  # umbrella belongs to pr-preview.yml.
                  clean: true
                  clean-exclude: pr-preview/
